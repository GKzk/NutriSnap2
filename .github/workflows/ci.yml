name: CI & Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Type check & Lint
      run: npm run lint

    - name: Build web app
      run: npm run build

    - name: Upload web dist artifact
      uses: actions/upload-artifact@v4
      with:
        name: nutrisnap-web-dist
        path: dist/

  build-android-apk:
    needs: build-web
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies & build web
      run: |
        npm install --legacy-peer-deps
        npm run build

    - name: Initialize Capacitor Android & build Debug APK
      run: |
        npm install --legacy-peer-deps --no-save @capacitor/core @capacitor/cli @capacitor/android
        npx cap add android
        npx cap sync android
        cd android && chmod +x gradlew && ./gradlew assembleDebug

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: NutriSnap-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
