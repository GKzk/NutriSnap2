name: CI & Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Type check & Lint
      run: npm run lint

    - name: Build web app
      env:
        VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      run: npm run build

    - name: Upload web dist artifact
      uses: actions/upload-artifact@v4
      with:
        name: nutrisnap-web-dist
        path: dist/

  build-android-apk:
    needs: build-web
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Configure pre-installed Android SDK
      run: |
        ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
        if [ -x "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
          yes | "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
        fi

    - name: Install dependencies & build web
      env:
        VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      run: |
        npm install --legacy-peer-deps
        npm run build

    - name: Initialize Capacitor Android & build Debug APK
      run: |
        npm install --legacy-peer-deps --no-save @capacitor/core @capacitor/cli @capacitor/android
        npx cap add android
        npx cap sync android
        node -e '
          const fs = require("fs");
          const p = "android/app/src/main/AndroidManifest.xml";
          let xml = fs.readFileSync(p, "utf8");
          const perms = [
            "<uses-permission android:name=\"android.permission.CAMERA\" />",
            "<uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />",
            "<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />"
          ];
          for (const perm of perms) {
            if (!xml.includes(perm)) {
              xml = xml.replace("<application", perm + "\n    <application");
            }
          }
          fs.writeFileSync(p, xml);
        '
        cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

    - name: Upload Android APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: NutriSnap-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Publish direct APK to GitHub Releases
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk NutriSnap.apk
        gh release upload latest NutriSnap.apk --clobber || gh release create latest NutriSnap.apk --target "${{ github.sha }}" --title "NutriSnap Android APK" --notes "Нажмите на NutriSnap.apk ниже, чтобы скачать и установить приложение на Android без распаковки архива."
